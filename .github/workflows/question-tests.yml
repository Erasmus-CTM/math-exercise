name: Declarative question tests
on:
  pull_request:
    paths:
      - _extensions/math-exercise/**
      - tests/question-tests*.mjs
      - .github/pins.json
      - .github/workflows/question-tests.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: math-question-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.9'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: windows-latest, python: '3.12'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - uses: ./.github/actions/quarto-dependencies
      - run: python -m pip install -r _ctm-checkers-source/ci/requirements.txt
      - run: npm ci --ignore-scripts
      - name: Actual direct-script and Quarto filter paths
        run: node --test tests/question-tests-shim.test.mjs tests/question-tests-render.test.mjs tests/question-tests-declarative-render.test.mjs
