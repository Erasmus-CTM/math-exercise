name: Browser interactions
on:
  pull_request:
    paths: ['_extensions/**', '_includes/**', '*.qmd', 'tests/browser/**', 'tests/build-similar-profiles.py', 'playwright.config.mjs', 'package*.json', '.github/workflows/browser.yml', '.github/pins.json', '.github/actions/**']
  push:
    paths: ['_extensions/**', '_includes/**', '*.qmd', 'tests/browser/**', 'tests/build-similar-profiles.py', 'playwright.config.mjs', 'package*.json', '.github/workflows/browser.yml', '.github/pins.json', '.github/actions/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - name: Install ctm-libs, ctm-checkers and JSXGraph (pins, review refs)
        uses: ./.github/actions/quarto-dependencies
      - run: python -m pip install sympy==1.13.3 'networkx>=3.4' 'PyYAML>=6'  # SymPy: the version Pyodide 0.28.3 ships
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: quarto render
      - run: python tests/build-similar-profiles.py
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-test-evidence
          path: |
            playwright-report/
            test-results/browser/
