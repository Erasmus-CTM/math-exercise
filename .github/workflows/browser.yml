name: Browser interactions
on:
  pull_request:
    paths: ['_extensions/**', '_includes/**', '*.qmd', 'tests/browser/**', 'playwright.config.mjs', 'package*.json', '.github/workflows/browser.yml']
  push:
    paths: ['_extensions/**', '_includes/**', '*.qmd', 'tests/browser/**', 'playwright.config.mjs', 'package*.json', '.github/workflows/browser.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Select explicit review dependencies (main keeps normal defaults)
        id: review
        env:
          REVIEW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/review-dependencies.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - name: Install ai-feedback and JSXGraph
        uses: ./.github/actions/quarto-dependencies
        with:
          ai-feedback-ref: ${{ steps.review.outputs['ai-feedback'] || 'main' }}
      - run: python -m pip install sympy==1.14.0 networkx==3.4.2 PyYAML==6.0.2
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: quarto render
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-evidence
          path: |
            playwright-report/
            test-results/browser/
