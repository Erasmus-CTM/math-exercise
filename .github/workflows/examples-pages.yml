name: Build and publish examples

on:
  push:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: write

# Every branch writes to gh-pages. Serializing the deployments prevents one
# preview from racing another even though each has its own destination folder.
concurrency:
  group: math-exercise-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AI_FEEDBACK_EXTENSION: ${{ github.workspace }}/_feedback-source/_extensions/ai-feedback
    steps:
      - uses: actions/checkout@v4
      - name: Fetch shared feedback dependency
        uses: actions/checkout@v4
        with:
          repository: Erasmus-CTM/ai-feedback
          ref: ac7817733b7bc7ce729537e8fb539efe83c339d9
          path: _feedback-source
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - name: Install shared Quarto dependency
        run: quarto add ./_feedback-source --no-prompt

      - name: Render examples
        run: |
          quarto render
          test -f _site/index.html
          test -f _site/examples.html
          test -f _site/example.html
          test -f _site/basic-features.html
          test -f _site/sympy-examples.html
          test -f _site/ai-feedback.html
          test -f _site/custom-assessment.html
          test -f _site/graphics-examples.html
          test -f _site/vector-matrix-tests.html
          test -f _site/dynamic-matrix-tests.html
          test -f _site/graph-theory.html
          test -f _site/docs/graph-editor.md

      - name: Select deployment directory
        id: destination
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "dir=." >> "${GITHUB_OUTPUT}"
          else
            branch_slug="${GITHUB_REF_NAME//\//-}"
            echo "dir=previews/${branch_slug}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish examples
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          destination_dir: ${{ steps.destination.outputs.dir }}
          # A main deployment is canonical and removes previews left by merged
          # or deleted feature branches. Feature deployments preserve the root
          # site and any other active previews.
          keep_files: ${{ github.ref_name != 'main' }}
