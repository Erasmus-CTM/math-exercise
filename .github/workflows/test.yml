name: Test math-exercise

on:
  # Pull requests and main; a branch push without a pull request runs nothing,
  # so no commit is tested twice.
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install checker test dependencies
        run: python -m pip install sympy==1.13.3 'networkx>=3.4' 'PyYAML>=6'  # SymPy: the version Pyodide 0.28.3 ships
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - name: Install ctm-libs, ctm-checkers and JSXGraph (pins, review refs)
        uses: ./.github/actions/quarto-dependencies
      - name: Install context extraction test dependencies
        run: npm ci
      - name: Test feedback and provider compatibility
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          node --test tests/*.test.mjs
      - name: Render the ordinary examples website with required approval
        run: |
          quarto render
          quarto render nb-render.qmd
          grep -Fq '"lang":"nb"' nb-render.html
          grep -Fq 'Tilbakemelding' nb-render.html
          grep -Fq 'Basic exercise features' _site/index.html
          grep -Fq 'Give students a question' _site/index.html
          grep -Fq 'Choose a page below' _site/index.html
          grep -Fq 'Expressions and equivalence' _site/sympy-examples.html
          grep -Fq 'Entering answers' _site/basic-features.html
          grep -Fq 'Automatic section context' _site/ai-feedback.html
          grep -Fq 'Assess a mathematical property' _site/custom-assessment.html
          grep -Fq 'This square-root iteration is also known as the Babylonian method' _site/custom-assessment.html
          grep -Fq 'A monic quadratic has leading coefficient 1' _site/custom-assessment.html
          ! grep -Fq '&amp;nbsp;' _site/custom-assessment.html
          grep -Fq 'mode: custom' _site/custom-assessment.html
          grep -Fq 'Click every local maximum' _site/graphics-examples.html
          ! grep -Fq 'bipartite-graph-board' _site/graphics-examples.html
          grep -Fq 'pooled-maxima-board' _site/graphics-examples.html
          grep -Fq 'period-window-board' _site/graphics-examples.html
          grep -Fq 'Move the two orange dots' _site/graphics-examples.html
          ! grep -Fq '**L**' _site/graphics-examples.html
          grep -Fq 'Draw and refine a non-decreasing curve' _site/graphics-examples.html
          grep -Fq 'A positive number' _site/graphics-examples.html
          grep -Fq 'Coordinate transformations' _site/graphics-examples.html
          grep -Fq 'An affine transformation combines' _site/graphics-examples.html
          grep -Fq 'Polar coordinates describe a point' _site/graphics-examples.html
          grep -Fq 'Cylindrical coordinates add height' _site/graphics-examples.html
          grep -Fq 'cube-transform-board' _site/graphics-examples.html
          grep -Fq 'polar-sector-board' _site/graphics-examples.html
          grep -Fq 'cylindrical-sector-board' _site/graphics-examples.html
          grep -Fq 'Show JSXGraph code' _site/graphics-examples.html
          ! grep -Fq 'rotation-order-board' _site/graphics-examples.html
          test "$(grep -Fc 'class="math-example-source"' _site/graphics-examples.html)" -eq 16
          original_line="$(grep -n 'Draw and refine a non-decreasing curve' _site/graphics-examples.html | head -1 | cut -d: -f1)"
          imported_line="$(grep -n 'Coordinate transformations' _site/graphics-examples.html | head -1 | cut -d: -f1)"
          test "$original_line" -lt "$imported_line"
          grep -Fq 'Remember the discriminant' _site/ai-feedback.html
          grep -Fq 'Explicit feedback context' _site/ai-feedback.html
          grep -Fq 'class="math-example-source"' _site/basic-features.html
          grep -Fq 'Show Quarto exercise source' _site/sympy-examples.html
          grep -Fq 'Vis Quarto-kildekode' _site/vector-matrix-tests.html
          grep -Fq 'Slik skriver du svar' _site/vector-matrix-tests.html
          grep -Fq 'class="math-vec' _site/vector-matrix-tests.html
          grep -Fq 'class="math-mat"' _site/vector-matrix-tests.html
          grep -Fq 'data-structural-field-labels=' _site/vector-matrix-tests.html
          # Norwegian component and cell labels: the page loads ctm-libs' catalogue.
          grep -Fq '"lang":"nb"' _site/vector-matrix-tests.html
          grep -Fq 'quarto-contrib/ctm-locale-math-exercise-' _site/vector-matrix-tests.html
          grep -Fq '"Komponent {n}"' _site/site_libs/quarto-contrib/ctm-locale-math-exercise-*/math-exercise.js
          grep -Fq '"Rad {row}, kolonne {column}"' _site/site_libs/quarto-contrib/ctm-locale-math-exercise-*/math-exercise.js
          # The checks: ctm-checkers' page script, a cacheable dependency, once per page.
          test "$(grep -Fc 'quarto-contrib/ctm-checkers-' _site/basic-features.html)" -eq 1
          ls _site/site_libs/quarto-contrib/ctm-checkers-*/ctm-checkers.js
          grep -Fq 'Bases with an unknown number of vectors' _site/dynamic-matrix-tests.html
          grep -Fq 'data-auto-cols="true"' _site/dynamic-matrix-tests.html
          grep -Fq 'data-auto-rows="true"' _site/dynamic-matrix-tests.html
          grep -Fq 'data-min-cols="0"' _site/dynamic-matrix-tests.html
          grep -Fq 'Row-space basis' _site/dynamic-matrix-tests.html
          grep -Fq 'Eigenspace basis' _site/dynamic-matrix-tests.html
          grep -Fq 'Basis of a polynomial subspace' _site/dynamic-matrix-tests.html
          grep -Fq 'Hessian with three variables' _site/dynamic-matrix-tests.html
          grep -Fq 'Adjacency matrix of a path' _site/dynamic-matrix-tests.html
          grep -Fq 'Empty matrix edge cases' _site/dynamic-matrix-tests.html
          test "$(grep -Fc 'class="math-example-source"' _site/dynamic-matrix-tests.html)" -eq 11
          grep -Fq 'Graph theory constructions' _site/graph-theory.html
          grep -Fq 'tree-construction-board' _site/graph-theory.html
          grep -Fq 'euler-construction-board' _site/graph-theory.html
          grep -Fq 'nonplanar-construction-board' _site/graph-theory.html
          grep -Fq 'bipartite-graph-board' _site/graph-theory.html
          grep -Fq 'Show controls' _site/graph-theory.html
          grep -Fq 'data-packages="[&quot;networkx&quot;]"' _site/graph-theory.html
          test "$(grep -Fc 'class="math-example-source"' _site/graph-theory.html)" -eq 8
          test -f _site/docs/graph-editor.md
          grep -Fq 'Graph editor API reference' _site/docs/graph-editor.md

      # Separate nonstudent output; never part of the ordinary website/publish tree.
      - name: Render authoring examples as review artifacts only
        env:
          CTM_VARIANTS: review
        run: quarto render generated-variants.qmd --profile variants-review
