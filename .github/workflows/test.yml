name: Test math-exercise

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test feedback and provider compatibility
        run: node --test tests/*.test.mjs
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render example and Norwegian regression pages
        run: |
          quarto render examples.qmd
          quarto render nb-render.qmd
          grep -Fq '"lang":"nb"' nb-render.html
          grep -Fq 'Tilbakemelding' nb-render.html
