name: Build standalone example
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Select explicit review dependencies (main keeps normal defaults)
        id: review
        env:
          REVIEW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/review-dependencies.py
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - name: Install ai-feedback and JSXGraph
        uses: ./.github/actions/quarto-dependencies
        with:
          ai-feedback-ref: ${{ steps.review.outputs['ai-feedback'] || 'main' }}
          jsxgraph-ref: ${{ steps.review.outputs['jsxgraph'] || 'v1.1.0' }}
      - name: Install variant build dependency
        run: python3 -m pip install PyYAML==6.0.2
      - name: Render standalone example
        run: |
          quarto render example.qmd
          test -f example.html || test -f _site/example.html
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-example
          path: |
            example.html
            example_files
            _site
